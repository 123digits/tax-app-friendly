name: SonarQube

# Pushes a SonarQube/SonarCloud analysis on every PR and on main.
#
# Requires two repo secrets:
#   SONAR_TOKEN     — user token issued by the Sonar server
#   SONAR_HOST_URL  — e.g. https://sonarcloud.io (or a self-hosted URL)
#
# The job:
#   1. Builds the app + runs the vitest suite with --coverage so lcov.info
#      exists. Sonar reads that to attribute per-file coverage.
#   2. Runs the eslint-plugin-sonarjs pass locally for fast feedback on PRs
#      (Sonar has its own analysis too — this is the preflight).
#   3. Invokes the official sonar-scanner-cli via SonarSource's action.
#      Results post to the Sonar dashboard; quality-gate pass/fail gates
#      the PR via Sonar's GitHub integration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to do author / blame analysis.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run lint (SonarJS rules surface here as well)
        run: npm run lint

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Quality-gate check — fails the job if the Sonar quality gate fails
      # (coverage drop, new bugs, maintainability regression, etc.).
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
