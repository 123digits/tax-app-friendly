name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, build, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `lint` runs eslint-plugin-sonarjs (the same rule set SonarQube's
      # JS/TS analyzer uses) so SonarJS findings fail CI here.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # `dup` runs jscpd with the same block-tokenization SonarQube CPD
      # uses; .jscpdrc.json's `threshold: 5` fails the job if the
      # duplicated-line percentage crosses it.
      - run: npm run dup

  test:
    name: Unit + integration (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Coverage thresholds are enforced by vitest.config.ts. A drop below
      # them fails this job.
      - run: npx vitest run --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
