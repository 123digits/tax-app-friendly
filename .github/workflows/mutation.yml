name: Mutation testing (nightly)

# Mutation testing is expensive. With vitest.related=false the runner has to
# run the entire ~1,000-test suite for every mutant it can't rule out via
# perTest coverage analysis, so a full pass across the configured 7 tax
# modules (~270 mutants) takes 30-45 minutes. Schedule it nightly rather
# than per-PR; results post as an artifact.

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  mutate:
    name: Stryker mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run Stryker
        run: npm run mutate
      - name: Upload Stryker HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
