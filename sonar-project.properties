# SonarQube / SonarCloud scanner configuration.
#
# Used by `npm run sonar` (see package.json scripts) and by the GitHub
# Actions workflow in .github/workflows/sonarqube.yml. The scanner reads
# these properties, bundles up the configured sources + lcov/coverage +
# test reports, and uploads to the SonarQube server at sonar.host.url.
#
# Requires two environment variables at scan time:
#   SONAR_TOKEN     — server-issued auth token (secret)
#   SONAR_HOST_URL  — e.g. https://sonarcloud.io or a self-hosted instance
#
# The organization/projectKey values below are placeholders — teams on
# SonarCloud should replace with their own (Sonar uses these to route
# results to the correct project dashboard).

sonar.projectKey=123digits_tax-app-friendly
sonar.organization=123digits
sonar.projectName=Tax App (Friendly)
sonar.projectVersion=0.1.0

# What to analyze.
sonar.sources=server,shared,src
sonar.tests=server,src,test-setup
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/reports/**,\
  **/.stryker-tmp/**,\
  **/*.d.ts,\
  e2e/**,\
  shared/types.ts

# Coverage + test reports. The vitest coverage-v8 reporter writes an
# `lcov.info` into coverage/ when `--coverage` is passed; SonarQube reads
# it to attribute line / branch coverage per file.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source encoding.
sonar.sourceEncoding=UTF-8

# Language hints so Sonar's TS analyzer picks up .vue SFCs properly.
sonar.javascript.file.suffixes=.js,.ts,.vue
sonar.typescript.file.suffixes=.ts,.tsx,.vue
